<!DOCTYPE html>

<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <title>Minha primeira aula de JS</title>

</head>

<body>

  <h1>Aula de JavaScript</h1>

  <script>

  let nome = prompt ("Digite o seu nome")
  let sobrenome = prompt ("DIgite o seu sobrenome")
  let ano_de_nascimento = prompt ("DIgite o seu ano de nascimento")
  let aluno = confirm("E aluno ativo da instituicao?")

  ano_de_nascimento = Number (ano_de_nascimento)
  let idade = 2026 - ano_de_nascimento
     let sobrenome_maiusculo = sobrenome.toUpperCase()
    let quantidade_letras = nome.length
    
    console.log ("CRACHÁ VIRTUAL: " + sobrenome_maiusculo + ", " + nome)
    console.log ("Idade estimada: " + idade + " anos.")
    console.log ("O seu primeiro nome tem " + quantidade_letras + " letras.")
    console.log ("Estatuto de aluno ativo: " + aluno)
    
  

  </script>
  
</body>

</html>
